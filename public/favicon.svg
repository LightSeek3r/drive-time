<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="1" stop-color="#080C1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ground)"/>
  <!-- light cast by the roads -->
  <g filter="url(#glow)" opacity="0.55">
    <rect x="104" y="160" width="232" height="48" fill="#FFB547"/>
    <rect x="336" y="160" width="72" height="48" fill="#FF6B57"/>
    <rect x="104" y="238" width="232" height="48" fill="#FFB547"/>
    <rect x="336" y="238" width="30" height="48" fill="#FF6B57"/>
    <rect x="104" y="316" width="232" height="48" fill="#FFB547"/>
  </g>
  <!-- cased roads -->
  <g stroke="#26325A" stroke-width="4">
    <rect x="104" y="160" width="232" height="48" rx="10" fill="#FFB547"/>
    <rect x="336" y="160" width="72" height="48" rx="10" fill="#FF6B57"/>
    <rect x="104" y="238" width="232" height="48" rx="10" fill="#FFB547"/>
    <rect x="336" y="238" width="30" height="48" rx="10" fill="#FF6B57"/>
    <rect x="104" y="316" width="232" height="48" rx="10" fill="#FFB547"/>
  </g>
  <!-- best slot -->
  <rect x="104" y="376" width="232" height="8" rx="4" fill="#4FE3B0"/>
</svg>
